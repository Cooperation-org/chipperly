name: CI

# Runs on our own runner on the Contabo server (label chipperly), beside live. github-runner.service
# caps it at 2 CPUs and 4 GB, so jobs queue one at a time and live keeps the rest. The repo is
# public: pull requests from forks never run here (the `if` on each job; the repo also asks for
# approval for every outside contributor).
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, chipperly]
    timeout-minutes: 45
    env:
      # The API tests start their own embedded Postgres (apps/api/test/globalSetup.ts).
      JWT_SECRET: ci-test-secret-please-change-me-32chars
      # apps/site (marketing site + CMS on Cloudflare D1) builds against a
      # local D1 created by wrangler; no Cloudflare credentials in CI.
      PAYLOAD_SECRET: ci-site-secret-please-change-me-32chars
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ffmpeg (apps/api/test/pipeline.test.ts transcodes a clip) is installed on the server.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Migrate the site's local D1
        run: pnpm -F @chipperly/site migrate

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 1

  e2e:
    needs: ci
    runs-on: [self-hosted, chipperly]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: [phone, tablet, desktop, ipad-webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @chipperly/shared build

      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out

      # e2e/server.mjs runs the API through tsx and boots an embedded Postgres itself.
      # ipad-webkit is the client's own device shape; the rest run on Chromium.
      # The browsers' system libraries were installed on the server once (playwright install-deps).
      - run: pnpm exec playwright install ${{ matrix.project == 'ipad-webkit' && 'webkit' || 'chromium' }}

      - run: pnpm e2e --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.project }}
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7

