name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chipperly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chipperly_test
      DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/chipperly_test
      JWT_SECRET: ci-test-secret-please-change-me-32chars
      # apps/site (marketing site + CMS) reads its own database at build time.
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/chipperly_site
      PAYLOAD_SECRET: ci-site-secret-please-change-me-32chars
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # apps/api/test/pipeline.test.ts transcodes a clip; the runner image has no ffmpeg.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Create and migrate the site database
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE chipperly_site'
          pnpm -F @chipperly/site migrate

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 1

  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [phone, tablet, desktop, ipad-webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pnpm install --frozen-lockfile

      - run: pnpm -F @chipperly/shared build

      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out

      # e2e/server.mjs runs the API through tsx and boots an embedded Postgres itself.
      # ipad-webkit is the client's own device shape; the rest run on Chromium.
      - run: pnpm exec playwright install --with-deps ${{ matrix.project == 'ipad-webkit' && 'webkit' || 'chromium' }}

      - run: pnpm e2e --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.project }}
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7
