# Chipperly — visual supports for neurodivergent children (schedule, chips, timer, first-then, stories, Chipper Chart)
# Backend: Node (Fastify) on 8064, serves the Next.js static export under /chipperly-next/ and the API under /chipperly-next/api/
# Not to be confused with golda's Rails demo of the OLD app: tmp-chipperly.service (:3044, chipperly.digisage.tech).
# Owner: mhany. Review by 2026-11-18. Repo: github.com/Cooperation-org/chipperly, checkout /home/mhany/chipperly

location /chipperly-next/ {
    proxy_pass http://127.0.0.1:8064;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 60m;
}
