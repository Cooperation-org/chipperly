packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  esbuild: true
  unrs-resolver: true
  # Neither package's build script is needed: firebase-admin loads and
  # works fine without it (protobufjs's is an optional perf-codegen step;
  # @firebase/util's is unrelated to Node usage).
  '@firebase/util': false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - embedded-postgres
  - unrs-resolver
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
